server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    charset_types text/css application/javascript text/plain;

    gzip on;
    gzip_types text/css application/javascript text/html;
    gzip_min_length 512;

    # app.js changes when you edit questions, so keep it short-lived
    location ~* \.(js|css)$ {
        add_header Cache-Control "public, max-age=3600";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
