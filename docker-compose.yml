services:
  n5drill:
    image: nginx:alpine
    container_name: n5drill
    restart: unless-stopped
    volumes:
      - /opt/n5drill/index.html:/usr/share/nginx/html/index.html:ro
      - /opt/n5drill/app.js:/usr/share/nginx/html/app.js:ro
      - /opt/n5drill/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8088:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3

# Reverse proxy notes
#
# Nginx Proxy Manager: add a proxy host for your subdomain pointing at
#   host <docker-host-ip>, port 8088. Request a Let's Encrypt cert there.
#
# Traefik: drop the `ports` block above and add instead:
#   labels:
#     - "traefik.enable=true"
#     - "traefik.http.routers.n5drill.rule=Host(`n5.example.com`)"
#     - "traefik.http.routers.n5drill.entrypoints=websecure"
#     - "traefik.http.routers.n5drill.tls.certresolver=letsencrypt"
#     - "traefik.http.services.n5drill.loadbalancer.server.port=80"
#   networks:
#     - proxy
# networks:
#   proxy:
#     external: true
